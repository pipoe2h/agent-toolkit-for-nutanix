name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical skills and references
        run: python3 scripts/validate-skills.py
      - name: Validate Agent Plugins package
        run: python3 scripts/validate-plugin.py
      - name: Check packaged skills match canonical skills
        run: python3 scripts/sync-plugin-skills.py --check
      - name: Check shell scripts parse
        run: |
          bash -n scripts/test.sh
          bash -n plugins/nutanix-core/scripts/launch-nutanix-mcp
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
